name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build renderer and main process
        run: npm run build

      - name: Upload installer, blockmap and latest.yml as a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is used automatically when CSC_LINK / CSC_KEY_PASSWORD
          # secrets are configured; otherwise the build ships unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish always

      - name: Verify updater artifacts exist
        shell: bash
        run: |
          ls -l release/latest.yml release/*.blockmap release/*-Setup-*.exe
